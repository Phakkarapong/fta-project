<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JorproA - Aviation Safety FTA</title>
    <link rel="icon" type="image/png" href="logo-icon.png">

    <link rel="stylesheet" href="theme.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="landing-wrap">

        <div class="landing-logo">
            <img src="logo-icon.png" alt="JorproA logo" style="width:100%;height:100%;object-fit:cover;">
        </div>

        <div class="landing-title">JorproA</div>
        <p class="landing-copy">
            ระบบวิเคราะห์ Fault Tree Analysis และประเมินความเสี่ยงด้านความปลอดภัยการบิน
            เลือกบทบาทของคุณเพื่อเข้าสู่ระบบ
        </p>

        <div class="role-grid">

            <button id="safetyOfficerBtn" type="button" class="role-card">
                <div class="role-card-icon" id="soIcon"></div>
                <div>
                    <div class="role-card-title">Safety Officer</div>
                    <p class="role-card-sub">
                        สร้างและจัดการการวิเคราะห์ Fault Tree ตั้งแต่ต้นจนถึงการส่งต่อผู้เชี่ยวชาญ
                    </p>
                </div>
            </button>

            <button id="expertBtn" type="button" class="role-card">
                <div class="role-card-icon" id="exIcon"></div>
                <div>
                    <div class="role-card-title">Expert</div>
                    <p class="role-card-sub">
                        ตรวจสอบความเสี่ยงและยืนยันผลการตัดสินใจด้านความปลอดภัย
                    </p>
                </div>
            </button>

        </div>

        <div class="trust-row">
            <span class="trust-chip">Fault Tree Analysis</span>
            <span class="trust-chip">FAA Risk Matrix</span>
            <span class="trust-chip">Weighted Risk Scoring</span>
        </div>

    </div>

    <script src="icons.js"></script>
    <script>
        document.getElementById("soIcon").innerHTML = Icon("shield", "", 22);
        document.getElementById("exIcon").innerHTML = Icon("check-circle", "", 22);
    </script>

    <script src="notify.js"></script>

    <!-- External Logic File (untouched) -->
    <script src="script.js"></script>

</body>

</html>
