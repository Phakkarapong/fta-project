<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Result History - JorproA</title>
    <link rel="icon" type="image/png" href="../logo-icon.png">

    <link rel="stylesheet" href="../theme.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

    <!-- SheetJS (client-side .xlsx export, no server needed) -->
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="app-shell">
        <div class="main-area">

            <header class="topbar" id="appTopbar"></header>

            <main class="main-content" id="pageContent">

                <div style="display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;">
                    <div>
                        <span class="ui-eyebrow">RESULT HISTORY</span>
                        <h1 class="ui-h1">Analysis Result History</h1>
                        <p class="ui-sub">ประวัติผลการวิเคราะห์และการประเมินความเสี่ยงทั้งหมด</p>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                        <span id="resultCount" class="status-badge status-badge-blue" style="font-size:11px;padding:6px 12px;">0 RESULTS</span>
                        <button id="exportExcelBtn" type="button" class="ui-btn ui-btn-secondary ui-btn-sm">
                            <span id="icoDownload"></span> Export Excel
                        </button>
                        <button id="refreshBtn" type="button" class="ui-btn ui-btn-ghost ui-btn-sm">
                            <span id="icoRefresh"></span> Refresh
                        </button>
                    </div>
                </div>

                <div class="ui-card ui-card-pad">
                    <main id="historyList"></main>

                    <section id="emptyResultHistory" class="hidden dt-empty">
                        ยังไม่มีผลการวิเคราะห์ที่บันทึกไว้ — No Analysis Result History
                    </section>
                </div>

            </main>

        </div>
    </div>

    <script src="../icons.js"></script>
    <script src="../notify.js"></script>
    <script src="../shell.js"></script>
    <script>
        Shell.mount({ role: "expert", active: "history", title: "Result History" });
        document.getElementById("icoDownload").innerHTML = Icon("download", "", 14);
        document.getElementById("icoRefresh").innerHTML = Icon("refresh", "", 14);
    </script>

    <script src="../data-table.js"></script>
    <script src="analysis-result-history.js"></script>
</body>
</html>
