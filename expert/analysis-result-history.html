<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Result History - JorproA</title>
    <link rel="icon" type="image/png" href="../logo-icon.png">


    <!-- Google Fonts: Noto Sans Thai (display, UI, Thai), IBM Plex Mono (data tags) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SheetJS (client-side .xlsx export, no server needed) -->
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        jorpro: {
                            ink: '#101828',
                            slate: '#475467',
                            mute: '#8A94A6',
                            canvas: '#F3F5F9',
                            surface: '#FFFFFF',
                            line: '#E2E7EF',
                            blue: '#123E7C',
                            blueMid: '#2A5FAE',
                            blueBright: '#2E6FE0',
                            red: '#C21F2E',
                            redDim: '#F6E4E5',
                            redLight: '#FF97A0',
                        }
                    },
                    fontFamily: {
                        display: ['"Noto Sans Thai"', 'sans-serif'],
                        sans: ['"Noto Sans Thai"', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        .strip-topbar { background: #C21F2E; }
        .bg-instrument-pattern {
            background-image: radial-gradient(rgba(16, 24, 40, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        button:focus-visible, select:focus-visible, a:focus-visible {
            outline: 2px solid #2E6FE0;
            outline-offset: 2px;
        }
        body { padding-top: 3px; }

        /* Same sky as the landing page, fixed to the viewport so it
           reads correctly behind scrolling content. */
        body {
            background:
                radial-gradient(circle at top right, rgba(134, 183, 238, 0.16), transparent 34%),
                radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.10), transparent 30%),
                linear-gradient(180deg, #081D3F 0%, #123E7C 28%, #1F5DAD 52%, #3A7FD9 74%, #86B7EE 100%);
            background-attachment: fixed;
        }
        .jorpro-clouds { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .jorpro-cloud {
            position: absolute;
            border-radius: 9999px;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.95), rgba(255,255,255,0) 70%);
            filter: blur(12px);
        }
        .jorpro-cloud-a { width: 280px; height: 95px; top: 6%; left: 4%; opacity: 0.55; }
        .jorpro-cloud-b { width: 210px; height: 72px; top: 15%; right: 8%; opacity: 0.45; }
        .jorpro-cloud-c { width: 330px; height: 112px; top: 42%; left: -5%; opacity: 0.4; }
        .jorpro-cloud-d { width: 230px; height: 82px; top: 58%; right: -3%; opacity: 0.35; }
        .jorpro-cloud-e { width: 185px; height: 66px; top: 78%; left: 42%; opacity: 0.32; }
        @media (prefers-reduced-motion: reduce) { .jorpro-cloud { animation: none !important; } }

        .status-high { color: #C2410C; }
        .status-medium { color: #A16207; }
        .status-low { color: #15803D; }
        .status-intolerable { color: #C21F2E; }
        .status-tolerable { color: #A16207; }
        .status-acceptable { color: #15803D; }
    </style>
</head>

<body class="text-jorpro-ink min-h-screen antialiased">

<div class="strip-topbar w-full h-[3px] fixed top-0 left-0 right-0 z-50"></div>
<div class="jorpro-clouds" aria-hidden="true">
    <div class="jorpro-cloud jorpro-cloud-a"></div>
    <div class="jorpro-cloud jorpro-cloud-b"></div>
    <div class="jorpro-cloud jorpro-cloud-c hidden sm:block"></div>
    <div class="jorpro-cloud jorpro-cloud-d hidden sm:block"></div>
    <div class="jorpro-cloud jorpro-cloud-e hidden lg:block"></div>
</div>

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8 relative z-10">

    <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4
                   p-5 rounded-2xl bg-white border border-jorpro-line shadow-xl">

        <div>
            <span class="text-[10px] font-bold tracking-widest text-jorpro-blue uppercase">
                EXPERT
            </span>

            <h1 class="text-2xl font-extrabold text-jorpro-ink mt-1">
                Analysis Result History
            </h1>

            <p class="text-xs text-jorpro-mute mt-1">
                ประวัติผลการวิเคราะห์ในรูปแบบเดียวกับ Analysis Result
            </p>
        </div>

        <div class="flex items-center gap-2">

            <span class="hidden sm:inline text-[10px] text-jorpro-mute">
                DELETE removes the saved Analysis record.
            </span>

            <span id="resultCount"
                  class="px-3 py-2 rounded-xl bg-jorpro-canvas border border-jorpro-line
                         text-xs font-bold text-jorpro-slate">
                0 RESULTS
            </span>

            <button id="exportExcelBtn"
                    type="button"
                    class="px-4 py-2.5 rounded-xl bg-emerald-50 hover:bg-emerald-100
                           border border-emerald-200 text-xs font-bold text-emerald-700">
                ⬇ EXPORT EXCEL
            </button>

            <button id="refreshBtn"
                    type="button"
                    class="px-4 py-2.5 rounded-xl bg-jorpro-canvas hover:bg-slate-100
                           border border-jorpro-line text-xs font-bold">
                ↻ REFRESH
            </button>

            <button id="backBtn"
                    type="button"
                    class="px-4 py-2.5 rounded-xl bg-jorpro-canvas hover:bg-slate-100
                           border border-jorpro-line text-xs font-bold">
                ← BACK
            </button>

        </div>

    </header>


    <main id="historyList"
          class="space-y-8 mt-6">
    </main>


    <section id="emptyResultHistory"
             class="hidden mt-6 rounded-2xl bg-white
                    border border-jorpro-line p-12 text-center">

        <div class="text-4xl mb-4">
            📋
        </div>

        <h2 class="text-lg font-bold text-jorpro-ink">
            No Analysis Result History
        </h2>

        <p class="text-sm text-jorpro-mute mt-2">
            ยังไม่มีผลการวิเคราะห์ที่บันทึกไว้
        </p>

    </section>

</div>

<script src="analysis-result-history.js"></script>
</body>
</html>
