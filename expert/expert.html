<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Dashboard - Expert | JorproA</title>
    <link rel="icon" type="image/png" href="../logo-icon.png">

    <script src="../theme-boot.js"></script>
    <link rel="stylesheet" href="../theme.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="app-shell">

        <div class="main-area">

            <header class="topbar" id="appTopbar"></header>

            <main class="main-content" id="pageContent">

                <div class="ui-card ui-card-pad" style="margin-bottom:20px;">
                    <span class="ui-eyebrow">EXPERT CONTROL CENTER</span>
                    <h1 class="ui-h1">Expert</h1>
                    <p class="ui-sub">ภาพรวมงานวิเคราะห์และประเมินความเสี่ยงที่รอดำเนินการ</p>
                </div>

                <div class="ui-stat-row" style="margin-bottom:20px;">
                    <div class="ui-stat-tile">
                        <span class="ui-stat-label">รอดำเนินการ</span>
                        <div class="ui-stat-value" id="statPending">0</div>
                    </div>
                    <div class="ui-stat-tile">
                        <span class="ui-stat-label">กำลังวิเคราะห์</span>
                        <div class="ui-stat-value" id="statUnderAnalysis">0</div>
                    </div>
                    <div class="ui-stat-tile">
                        <span class="ui-stat-label">เสร็จสมบูรณ์</span>
                        <div class="ui-stat-value" id="statCompleted">0</div>
                    </div>
                    <div class="ui-stat-tile">
                        <span class="ui-stat-label">ทั้งหมดในระบบ</span>
                        <div class="ui-stat-value" id="statTotal">0</div>
                    </div>
                </div>

                <div class="ui-card ui-card-pad" style="margin-bottom:20px;">
                    <div class="ui-card-header" style="border:none;margin:0;padding:0;">
                        <div>
                            <span class="ui-eyebrow">เริ่มต้นใช้งาน</span>
                            <h2 class="ui-h2">การดำเนินการด่วน</h2>
                        </div>
                    </div>
                    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;">
                        <button id="ftaAnalysisBtn" type="button" class="ui-btn ui-btn-primary">
                            <span id="icoQueue"></span> เปิด Analysis Queue
                        </button>
                        <button id="resultBtn" type="button" class="ui-btn ui-btn-secondary">
                            <span id="icoResult"></span> ผลการวิเคราะห์ปัจจุบัน
                        </button>
                        <button id="resultHistoryBtn" type="button" class="ui-btn ui-btn-secondary">
                            <span id="icoHistory"></span> ประวัติผลการวิเคราะห์
                        </button>
                    </div>
                </div>

                <div class="ui-card ui-card-pad">
                    <div class="ui-card-header">
                        <div>
                            <span class="ui-eyebrow">QUEUE</span>
                            <h2 class="ui-h2">งานที่รอวิเคราะห์ล่าสุด</h2>
                        </div>
                        <a href="analysis-queue.html" class="ui-btn ui-btn-ghost ui-btn-sm">ดูทั้งหมด</a>
                    </div>
                    <div id="recentList"></div>
                </div>

            </main>

        </div>

    </div>

    <script src="../icons.js"></script>
    <script src="../notify.js"></script>
    <script src="../theme-toggle.js"></script>
    <script src="../shell.js"></script>
    <script>
        Shell.mount({ role: "expert", active: "dashboard", title: "Dashboard" });
        document.getElementById("icoQueue").innerHTML = Icon("inbox", "", 16);
        document.getElementById("icoResult").innerHTML = Icon("file-text", "", 16);
        document.getElementById("icoHistory").innerHTML = Icon("list", "", 16);

        (function renderDashboardStats() {
            var records = [];
            try {
                var raw = JSON.parse(localStorage.getItem("ftaAnalysisRecords"));
                records = Array.isArray(raw) ? raw : [];
            } catch (e) { records = []; }

            var counts = { PENDING_EXPERT: 0, UNDER_ANALYSIS: 0, COMPLETED: 0 };
            records.forEach(function (r) {
                var status = (r && (r.status || (r.analysisData && r.analysisData.status))) || "DRAFT";
                if (counts[status] === undefined) counts[status] = 0;
                counts[status]++;
            });

            document.getElementById("statPending").textContent = counts.PENDING_EXPERT;
            document.getElementById("statUnderAnalysis").textContent = counts.UNDER_ANALYSIS;
            document.getElementById("statCompleted").textContent = counts.COMPLETED;
            document.getElementById("statTotal").textContent = records.length;

            function esc(v) {
                return String(v == null ? "" : v)
                    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }

            var STATUS_LABEL = { PENDING_EXPERT: "รอผู้เชี่ยวชาญ", UNDER_ANALYSIS: "กำลังวิเคราะห์" };
            var STATUS_CLASS = { PENDING_EXPERT: "status-badge-amber", UNDER_ANALYSIS: "status-badge-blue" };

            var queue = records
                .map(function (r) { return r.analysisData || r; })
                .filter(function (r) { return r.status === "PENDING_EXPERT" || r.status === "UNDER_ANALYSIS"; })
                .slice(0, 5);

            var list = document.getElementById("recentList");

            if (!queue.length) {
                list.innerHTML = '<div class="dt-empty">ไม่มีงานที่รอวิเคราะห์ในขณะนี้</div>';
                return;
            }

            list.innerHTML = '<div class="dt-list">' + queue.map(function (r) {
                var title = r.analysisTitle || r.title || "Untitled Analysis";
                var topEvent = r.topEvent || "-";
                var status = r.status || "PENDING_EXPERT";
                return (
                    '<div class="list-row" onclick="window.location.href=\'analysis-queue.html\'">' +
                    '<div class="list-row-icon">' + Icon("inbox", "", 16) + '</div>' +
                    '<div class="list-row-body">' +
                    '<div class="list-row-title-line">' +
                    '<span class="list-row-title">' + esc(title) + '</span>' +
                    '<span class="status-badge ' + (STATUS_CLASS[status] || "status-badge-slate") + '">' + esc(STATUS_LABEL[status] || status) + '</span>' +
                    '</div>' +
                    '<div class="list-row-subtitle">' + esc(topEvent) + '</div>' +
                    '</div>' +
                    '<div class="list-row-chevron">' + Icon("chevron-right", "", 16) + '</div>' +
                    '</div>'
                );
            }).join("") + '</div>';
        })();
    </script>

    <script src="expert.js"></script>

</body>

</html>
