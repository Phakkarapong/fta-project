<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis History - FTA TOOLS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            background:
                radial-gradient(circle at top right, rgba(6,182,212,.10), transparent 35%),
                #020617;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
        }
        .history-card { transition: .2s ease; }
        .history-card:hover {
            transform: translateY(-2px);
            border-color: rgba(6,182,212,.45);
        }
    </style>
</head>

<body>
<div class="min-h-screen max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">

    <header class="flex flex-col sm:flex-row items-center justify-between gap-4
                   p-4 sm:p-5 rounded-2xl bg-slate-900/80 border border-slate-800 shadow-xl">

        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600
                        flex items-center justify-center text-white text-lg">✈</div>

            <div>
                <h1 class="text-lg sm:text-xl font-bold tracking-wider text-white">
                    FTA <span class="text-cyan-400">TOOLS</span>
                </h1>
                <p class="text-[10px] sm:text-xs text-slate-400">
                    Aviation Safety Analysis System
                </p>
            </div>
        </div>

        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full
                    bg-slate-800 border border-slate-700
                    text-[10px] font-bold text-cyan-400 tracking-wider">
            <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
            SAFETY OFFICER
        </div>
    </header>

    <section class="mt-6 sm:mt-8 bg-slate-900/70 border border-slate-800
                    rounded-2xl p-6 sm:p-8 shadow-xl">

        <span class="text-[10px] font-bold tracking-widest text-cyan-400 uppercase">
            RECORDS
        </span>

        <h2 class="text-2xl sm:text-3xl font-extrabold text-white mt-1">
            Analysis History
        </h2>

        <p class="text-sm text-slate-300 mt-2">
            View previous Fault Tree Analysis records.
        </p>

        <p class="text-xs text-slate-500 mt-1">
            ประวัติการวิเคราะห์ Fault Tree
        </p>
    </section>

    <section class="flex flex-col sm:flex-row justify-between gap-3 mt-5">

        <button id="backBtn" type="button"
                class="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700
                       border border-slate-700 text-slate-200 text-xs font-bold">
            ← BACK TO SAFETY OFFICER
        </button>

        <button id="clearHistoryBtn" type="button"
                class="px-5 py-3 rounded-xl bg-red-500/10 hover:bg-red-500/20
                       border border-red-500/30 text-red-300 text-xs font-bold">
            CLEAR HISTORY
        </button>

    </section>

    <section class="mt-5 flex items-center justify-between px-4 py-3 rounded-xl
                    bg-slate-900/60 border border-slate-800">

        <span class="text-xs text-slate-400">Saved Analyses</span>
        <strong id="historyCount" class="text-sm text-cyan-400">0</strong>

    </section>

    <main id="historyList" class="mt-5 space-y-4"></main>

</div>

<script src="analysis-history.js"></script>
</body>
</html>
