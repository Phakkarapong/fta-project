<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis History - JorproA</title>
    <link rel="icon" type="image/png" href="../logo-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        jorpro: {
                            ink: '#101828', slate: '#475467', mute: '#8A94A6',
                            canvas: '#F3F5F9', surface: '#FFFFFF', line: '#E2E7EF',
                            blue: '#123E7C', blueMid: '#2A5FAE', blueBright: '#2E6FE0',
                            red: '#C21F2E', redDim: '#F6E4E5', redLight: '#FF97A0',
                        }
                    },
                    fontFamily: {
                        display: ['"Noto Sans Thai"', 'sans-serif'],
                        sans: ['"Noto Sans Thai"', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        .strip-topbar { background: #C21F2E; }
        body { padding-top: 3px; }
        button:focus-visible, select:focus-visible, input:focus-visible,
        textarea:focus-visible, a:focus-visible {
            outline: 2px solid #2E6FE0;
            outline-offset: 2px;
        }
    </style>
</head>

<body class="bg-jorpro-canvas text-jorpro-ink min-h-screen font-sans jorpro-page">

    <div class="strip-topbar w-full h-[3px] fixed top-0 left-0 right-0 z-50"></div>


    <!-- JORPROA BACKGROUND CLOUDS -->
    <div class="jorpro-clouds" aria-hidden="true">
        <div class="jorpro-cloud jorpro-cloud-a"></div>
        <div class="jorpro-cloud jorpro-cloud-b"></div>
        <div class="jorpro-cloud jorpro-cloud-c hidden sm:block"></div>
        <div class="jorpro-cloud jorpro-cloud-d hidden sm:block"></div>
        <div class="jorpro-cloud jorpro-cloud-e hidden lg:block"></div>
    </div>



<div class="max-w-6xl mx-auto px-4 py-6 md:py-8">

    <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 p-5 rounded-2xl bg-white border border-jorpro-line">

        <div>
            <div class="text-xs font-bold tracking-widest text-jorpro-blue">
                SAFETY OFFICER
            </div>

            <h1 class="text-2xl font-extrabold text-jorpro-ink mt-1">
                Analysis History
            </h1>

            <p class="text-xs text-jorpro-mute mt-1">
                ประวัติการวิเคราะห์ Fault Tree Analysis
            </p>
        </div>

        <button id="backBtn"
                type="button"
                class="px-4 py-2.5 rounded-xl bg-jorpro-canvas hover:bg-slate-100 border border-jorpro-line text-xs font-bold text-jorpro-slate">
            ← BACK
        </button>

    </header>

    <section class="mt-6 flex items-center justify-between gap-4 bg-white border border-jorpro-line rounded-2xl p-5 shadow-xl">
        <div>
            <span class="text-[10px] tracking-widest text-jorpro-mute font-bold">
                RECORDS
            </span>
            <h2 class="text-lg font-bold text-jorpro-ink">
                Previous Analyses
            </h2>
        </div>

        <span id="recordCount"
              class="px-3 py-1.5 rounded-full bg-jorpro-blue/10 border border-jorpro-blue/20 text-jorpro-blueBright text-[10px] font-bold">
            0 RECORDS
        </span>
    </section>

    <main id="historyList"
          class="mt-5 space-y-4">
    </main>

</div>

<script src="analysis-history.js"></script>
</body>
</html>
