<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Analysis History - JorproA</title>
    <link rel="icon" type="image/png" href="../logo-icon.png">

    <script src="../theme-boot.js"></script>
    <link rel="stylesheet" href="../theme.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="app-shell">
        <div class="main-area">

            <header class="topbar" id="appTopbar"></header>

            <main class="main-content" id="pageContent">

                <div class="ui-card-header" style="border:none;padding:0;margin-bottom:18px;">
                    <div>
                        <span class="ui-eyebrow">RECORDS</span>
                        <h1 class="ui-h1">Analysis History</h1>
                        <p class="ui-sub">ประวัติการวิเคราะห์ Fault Tree ทั้งหมด — ค้นหา กรอง และดูรายละเอียดแต่ละรายการ</p>
                    </div>
                    <span id="recordCount" class="status-badge status-badge-blue" style="font-size:11px;padding:6px 12px;">0 RECORDS</span>
                </div>

                <div class="ui-card ui-card-pad">
                    <main id="historyList"></main>
                </div>

            </main>

        </div>
    </div>

    <script src="../icons.js"></script>
    <script src="../notify.js"></script>
    <script src="../theme-toggle.js"></script>
    <script src="../shell.js"></script>
    <script>Shell.mount({ role: "safety-officer", active: "history", title: "Analysis History" });</script>

    <script src="../data-table.js"></script>
    <script src="analysis-history.js"></script>
</body>
</html>
