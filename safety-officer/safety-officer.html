<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Dashboard - Safety Officer | JorproA</title>
    <link rel="icon" type="image/png" href="../logo-icon.png">

    <script src="../theme-boot.js"></script>
    <link rel="stylesheet" href="../theme.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="app-shell">

        <div class="main-area">

            <header class="topbar" id="appTopbar"></header>

            <main class="main-content" id="pageContent">

                <div id="soNotificationBanner"></div>

                <div class="ui-card ui-card-pad" style="margin-bottom:20px;">
                    <span class="ui-eyebrow">SAFETY OPERATIONS CENTER</span>
                    <h1 class="ui-h1">Safety Officer</h1>
                    <p class="ui-sub">ภาพรวมงานวิเคราะห์ Fault Tree ทั้งหมดของคุณ</p>
                </div>

                <div class="ui-stat-row" style="margin-bottom:20px;">
                    <div class="ui-stat-tile">
                        <span class="ui-stat-label">ทั้งหมด</span>
                        <div class="ui-stat-value" id="statTotal">0</div>
                    </div>
                    <div class="ui-stat-tile">
                        <span class="ui-stat-label">แบบร่าง</span>
                        <div class="ui-stat-value" id="statDraft">0</div>
                    </div>
                    <div class="ui-stat-tile">
                        <span class="ui-stat-label">รอผู้เชี่ยวชาญ</span>
                        <div class="ui-stat-value" id="statPending">0</div>
                    </div>
                    <div class="ui-stat-tile">
                        <span class="ui-stat-label">เสร็จสมบูรณ์</span>
                        <div class="ui-stat-value" id="statCompleted">0</div>
                    </div>
                </div>

                <div class="ui-card ui-card-pad" style="margin-bottom:20px;">
                    <div class="ui-card-header" style="border:none;margin:0;padding:0;">
                        <div>
                            <span class="ui-eyebrow">เริ่มต้นใช้งาน</span>
                            <h2 class="ui-h2">การดำเนินการด่วน</h2>
                        </div>
                    </div>
                    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;">
                        <button id="newAnalysisBtn" type="button" class="ui-btn ui-btn-primary">
                            <span id="icoPlus"></span> สร้างการวิเคราะห์ใหม่
                        </button>
                        <button id="historyBtn" type="button" class="ui-btn ui-btn-secondary">
                            <span id="icoHistory"></span> ดูประวัติการวิเคราะห์
                        </button>
                        <button id="analysisResultBtn" type="button" class="ui-btn ui-btn-secondary">
                            <span id="icoResult"></span> ผลการวิเคราะห์ล่าสุด
                        </button>
                    </div>
                </div>

                <div class="ui-card ui-card-pad">
                    <div class="ui-card-header">
                        <div>
                            <span class="ui-eyebrow">RECENT</span>
                            <h2 class="ui-h2">การวิเคราะห์ล่าสุด</h2>
                        </div>
                        <a href="analysis-history.html" class="ui-btn ui-btn-ghost ui-btn-sm">ดูทั้งหมด</a>
                    </div>
                    <div id="recentList"></div>
                </div>

            </main>

        </div>

    </div>

    <script src="../icons.js"></script>
    <script src="../notify.js"></script>
    <script src="../theme-toggle.js"></script>
    <script src="../shell.js"></script>
    <script>
        Shell.mount({ role: "safety-officer", active: "dashboard", title: "Dashboard" });
        document.getElementById("icoPlus").innerHTML = Icon("plus", "", 16);
        document.getElementById("icoHistory").innerHTML = Icon("list", "", 16);
        document.getElementById("icoResult").innerHTML = Icon("file-text", "", 16);

        (function renderDashboardStats() {
            var records = [];
            try {
                var raw = JSON.parse(localStorage.getItem("ftaAnalysisRecords"));
                records = Array.isArray(raw) ? raw : [];
            } catch (e) { records = []; }

            var counts = { DRAFT: 0, PENDING_EXPERT: 0, UNDER_ANALYSIS: 0, COMPLETED: 0 };
            records.forEach(function (r) {
                var status = (r && (r.status || (r.analysisData && r.analysisData.status))) || "DRAFT";
                if (counts[status] === undefined) counts[status] = 0;
                counts[status]++;
            });

            document.getElementById("statTotal").textContent = records.length;
            document.getElementById("statDraft").textContent = counts.DRAFT;
            document.getElementById("statPending").textContent = counts.PENDING_EXPERT + counts.UNDER_ANALYSIS;
            document.getElementById("statCompleted").textContent = counts.COMPLETED;

            var list = document.getElementById("recentList");
            var recent = records.slice(0, 5);

            if (!recent.length) {
                list.innerHTML = '<div class="dt-empty">ยังไม่มีการวิเคราะห์ — เริ่มสร้างรายการแรกของคุณ</div>';
                return;
            }

            function esc(v) {
                return String(v == null ? "" : v)
                    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }

            var STATUS_LABEL = { DRAFT: "แบบร่าง", PENDING_EXPERT: "รอผู้เชี่ยวชาญ", UNDER_ANALYSIS: "กำลังวิเคราะห์", COMPLETED: "เสร็จสมบูรณ์" };
            var STATUS_CLASS = { DRAFT: "status-badge-slate", PENDING_EXPERT: "status-badge-amber", UNDER_ANALYSIS: "status-badge-blue", COMPLETED: "status-badge-green" };

            list.innerHTML = '<div class="dt-list">' + recent.map(function (r) {
                var src = r.analysisData || r;
                var title = src.analysisTitle || src.title || "Untitled Analysis";
                var topEvent = src.topEvent || "-";
                var status = src.status || "DRAFT";
                return (
                    '<div class="list-row" onclick="window.location.href=\'analysis-history.html\'">' +
                    '<div class="list-row-icon">' + Icon("file-text", "", 16) + '</div>' +
                    '<div class="list-row-body">' +
                    '<div class="list-row-title-line">' +
                    '<span class="list-row-title">' + esc(title) + '</span>' +
                    '<span class="status-badge ' + (STATUS_CLASS[status] || "status-badge-slate") + '">' + esc(STATUS_LABEL[status] || status) + '</span>' +
                    '</div>' +
                    '<div class="list-row-subtitle">' + esc(topEvent) + '</div>' +
                    '</div>' +
                    '<div class="list-row-chevron">' + Icon("chevron-right", "", 16) + '</div>' +
                    '</div>'
                );
            }).join("") + '</div>';
        })();

        // "New result from Expert" banner — same pending list that badges
        // the "Analysis Result" sidebar link (Shell.getPendingSoReviewRecords()).
        // Clicking through opens that specific record directly; opening it
        // is what clears both this banner and the sidebar badge for it
        // (see analysis-result-view.js's render()).
        (function renderSoNotificationBanner() {
            var banner = document.getElementById("soNotificationBanner");
            if (!banner || !window.Shell) return;

            var pending = Shell.getPendingSoReviewRecords();
            if (!pending.length) return;

            var newest = pending[0];
            var title = newest.analysisTitle || newest.title || "Untitled Analysis";

            var subText =
                pending.length > 1
                    ? `ล่าสุด: "${title}" และอีก ${pending.length - 1} รายการ — พร้อมให้ตรวจสอบและกรอก Safety Mitigation`
                    : `"${title}" พร้อมให้ตรวจสอบและกรอก Safety Mitigation, Risk Owner, Type of Hazard`;

            banner.innerHTML =
                '<div class="ui-notify-banner">' +
                '<div class="ui-notify-banner-icon">' + Icon("bell", "", 18) + '</div>' +
                '<div class="ui-notify-banner-body">' +
                '<div class="ui-notify-banner-title">มีผลการวิเคราะห์ใหม่จาก Expert ' + pending.length + ' รายการ</div>' +
                '<div class="ui-notify-banner-sub">' + subText.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") + '</div>' +
                '</div>' +
                '<a href="analysis-result-view.html?id=' + encodeURIComponent(newest.id || "") + '" class="ui-btn ui-btn-primary ui-btn-sm">ดูผลการวิเคราะห์ →</a>' +
                '</div>';
        })();
    </script>

    <script src="safety-officer.js"></script>

</body>

</html>
